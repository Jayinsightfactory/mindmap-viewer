<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — 하루 작업 일지</title>
<style>
  :root{--bg:#f6f7f9;--sf:#fff;--ln:#e6e8ec;--tx:#1a1d21;--mu:#6b7280;--ac:#3b6cf6;--acs:#eaf0ff}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 Inter,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  a{color:var(--ac);text-decoration:none}
  .top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .top h1{font-size:16px;margin:0}.nav a{margin-right:10px;color:var(--mu)}
  .wrap{display:flex;min-height:calc(100vh - 50px)}
  .side{flex:0 0 200px;background:var(--sf);border-right:1px solid var(--ln);padding:10px}
  .sec{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mu);margin:8px 4px 6px}
  .ppl button{display:flex;justify-content:space-between;width:100%;padding:6px 10px;border:0;border-left:2px solid transparent;background:transparent;cursor:pointer;text-align:left;font:inherit;border-radius:0 8px 8px 0}
  .ppl button:hover{background:var(--bg)}.ppl button.on{background:var(--acs);border-left-color:var(--ac);color:#2450c8;font-weight:600}
  .ppl small{color:var(--mu)}
  .main{flex:1;min-width:0;padding:14px 18px}
  .week{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .week .nav2 button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:5px 10px;cursor:pointer}
  .days{display:inline-flex;padding:3px;border-radius:10px;background:#eceef2;gap:2px}
  .days button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--mu);font-weight:500;font:inherit}
  .days button.on{background:var(--sf);color:var(--tx);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .days button small{display:block;font-size:10px;color:var(--mu)}
  .days button.has::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin:2px auto 0}
  .sum{display:flex;gap:16px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin-bottom:14px}
  .sum b{font-size:15px}.sum .k{color:var(--mu);font-size:11.5px;display:block}
  .tl{position:relative;padding-left:22px}.tl::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--ln)}
  .ev{position:relative;margin-bottom:10px}.ev::before{content:'';position:absolute;left:-18px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid #fff;box-shadow:0 0 0 1px var(--ln)}
  .ev.mark::before{background:#16a34a}.ev.gap::before{background:#d1d5db}.ev.off::before{background:#ef4444}
  .card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;gap:12px}
  .card .txt{flex:1;min-width:0}.card .img{flex:0 0 220px}
  .img img{width:220px;border-radius:8px;border:1px solid var(--ln);cursor:zoom-in;display:block}
  .t{font-weight:700}.t .dur{color:var(--mu);font-weight:500;margin-left:6px}.t .app{margin-left:8px;color:#2450c8;font-weight:600}
  .stage{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;background:#dfe8ff;color:#2450c8;margin-left:6px;vertical-align:1px}
  .scr{color:var(--tx);margin:2px 0 4px}
  .kv{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;font-size:12.5px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-all}
  .kv dd ul{margin:0;padding-left:16px}
  .gapc{color:var(--mu);padding:4px 0}
  .mark .card{background:#f0fdf4;border-color:#bbf7d0}.off .card{background:#fef2f2;border-color:#fecaca}
  .empty{color:var(--mu);padding:40px;text-align:center;background:var(--sf);border:1px dashed var(--ln);border-radius:12px}
  .tools{margin-left:auto;display:flex;gap:6px}.tools button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:5px 10px;cursor:pointer}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#modal img{max-width:96vw;max-height:94vh;border-radius:8px}
  .warn{color:#b45309}
  @media(max-width:900px){.wrap{flex-direction:column}.side{flex:0 0 auto;border-right:0;border-bottom:1px solid var(--ln)}.card{flex-direction:column}.card .img,.img img{flex-basis:auto;width:100%}}
</style>
</head>
<body>
<div class="top"><h1>하루 작업 일지</h1><span class="nav" data-site-nav></span><span id="who" style="color:var(--mu)"></span></div>
<div class="wrap">
  <aside class="side"><div class="sec">직원</div><div class="ppl" id="ppl">불러오는 중…</div></aside>
  <main class="main">
    <div class="week">
      <span class="nav2"><button id="prevW">‹ 지난주</button> <button id="thisW">이번 주</button> <button id="nextW">다음주 ›</button></span>
      <span id="wlabel" style="font-weight:700"></span>
      <span class="days" id="days"></span>
      <span class="tools"><button id="copyTxt">텍스트 복사</button><button id="reload">새로고침</button></span>
    </div>
    <div id="sum" class="sum" hidden></div>
    <div id="tl" class="tl"></div>
  </main>
</div>
<div id="modal"><img id="mimg" alt=""></div>
<script src="/js/site-nav.js"></script>
<script>
const TOKEN = localStorage.getItem('orbit_token') || '';
const AUTH = { headers: { Authorization: 'Bearer ' + TOKEN } };
const $ = (s) => document.querySelector(s);
const KST = 9 * 3600e3;
const kst = (t) => new Date(new Date(t).getTime() + KST);             // KST 벽시계로 옮긴 Date(UTC 필드로 읽음)
const hm = (t) => { const d = kst(t); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
const dayKey = (t) => kst(t).toISOString().slice(0, 10);
const mins = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

let people = [], me = null, weekMon = null, day = null, cache = {};

// ── 주(월~금) 계산: KST 기준 오늘이 속한 주의 월요일
function mondayOf(d) { const x = new Date(d.getTime()); const dow = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() - dow + 1); x.setUTCHours(0, 0, 0, 0); return x; }
function ymd(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const x = new Date(d.getTime()); x.setUTCDate(x.getUTCDate() + n); return x; }

async function loadPeople() {
  const j = await (await fetch('/api/flow/vision-quality?days=14', AUTH)).json();
  if (!j.ok) { $('#ppl').innerHTML = '<span class="warn">관리자 로그인 필요 (my-work.html에서 로그인)</span>'; return; }
  people = (j.people || []).filter((p) => p.captures > 0 && p.name && !/^MN/.test(p.name)).sort((a, b) => b.captures - a.captures);
  const u = new URLSearchParams(location.search); me = people.find((p) => p.userId === u.get('u')) || people[0];
  renderPeople();
}
function renderPeople() {
  $('#ppl').innerHTML = people.map((p) => `<button class="${me && p.userId === me.userId ? 'on' : ''}" data-u="${p.userId}"><span>${esc(p.name)}</span><small>${p.captures}</small></button>`).join('');
  $('#ppl').querySelectorAll('button').forEach((b) => b.onclick = () => { me = people.find((p) => p.userId === b.dataset.u); renderPeople(); loadWeek(); });
}

// ── 하루 데이터: 해독(raw, 썸네일 포함) + 캡처/키보드(출근·퇴근·활동 경계용)
async function fetchDay(uid, d) {
  const key = uid + '|' + d; if (cache[key]) return cache[key];
  const from = ymd(addDays(new Date(d + 'T00:00:00Z'), -1)), to = ymd(addDays(new Date(d + 'T00:00:00Z'), 2)); // 텍스트 비교라 넉넉히 받고 KST 날짜로 거른다
  const get = async (type, raw) => { const j = await (await fetch(`/api/learning/logs?allTypes=1&userId=${uid}&type=${type}&from=${from}&to=${to}&limit=2000${raw ? '&raw=1' : ''}`, AUTH)).json(); return (j.events || j.logs || []).filter((e) => dayKey(e.timestamp) === d); };
  const [an, cap, kb] = await Promise.all([get('screen.analyzed', true), get('screen.capture', false), get('keyboard.chunk', false)]);
  const r = { an: an.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)), cap, kb };
  cache[key] = r; return r;
}

// ── 타임라인 구성: 같은 화면 연속 → 한 블록, 25분 이상 공백 → 자리 비움
function buildTimeline({ an, cap, kb }) {
  const all = [...an, ...cap, ...kb].map((e) => new Date(e.timestamp).getTime()).sort((a, b) => a - b);
  if (!all.length) return null;
  const start = all[0], end = all[all.length - 1];
  const kbTimes = kb.map((e) => new Date(e.timestamp).getTime());
  const blocks = [];
  for (const e of an) {
    const d = e.data || {}; const key = d.screenKey || (d.app + '|' + d.screen);
    const last = blocks[blocks.length - 1];
    if (last && last.key === key && mins(last.end, e.timestamp) <= 25) { last.end = e.timestamp; last.n++; last.items.push(d); continue; }
    blocks.push({ key, start: e.timestamp, end: e.timestamp, n: 1, items: [d], thumb: d.thumbnail || '' });
  }
  // 공백 삽입(캡처/키보드 포함한 전체 활동 기준)
  const out = []; let prevEnd = start;
  for (const b of blocks) {
    const bs = new Date(b.start).getTime();
    // 블록 직전 활동(캡처/키보드)의 마지막 시각
    const lastAct = all.filter((t) => t < bs && t >= prevEnd).pop() || prevEnd;
    const gap = Math.round((bs - lastAct) / 60000);
    if (gap >= 25) out.push({ gap, at: new Date(lastAct).toISOString(), until: b.start });
    b.kb = kbTimes.filter((t) => t >= bs - 60000 && t <= new Date(b.end).getTime() + 60000).length;
    out.push(b); prevEnd = new Date(b.end).getTime();
  }
  return { start: new Date(start).toISOString(), end: new Date(end).toISOString(), blocks: out, nAn: an.length, nCap: cap.length, nKb: kb.length };
}

const uniq = (arr) => [...new Set(arr.filter(Boolean).map((s) => String(s).trim()))];
function blockText(b) {
  const it = b.items; const d0 = it[0];
  const fields = uniq(it.flatMap((d) => (Array.isArray(d.fields) ? d.fields : []).filter((f) => f && f.currentValue).map((f) => `${f.name}: ${f.currentValue}`))).slice(0, 6);
  const ent = it.reduce((m, d) => { const e = d.entities || {}; for (const k of ['products', 'customers', 'amounts', 'cycles', 'farms']) (e[k] || []).forEach((v) => (m[k] ||= new Set()).add(typeof v === 'string' ? v : JSON.stringify(v))); return m; }, {});
  const entLine = Object.entries(ent).map(([k, s]) => ({ products: '품목', customers: '거래처', amounts: '금액', cycles: '차수', farms: '농장' }[k] + ' ' + [...s].slice(0, 6).join(', ')).join(' · ');
  const tables = uniq(it.flatMap((d) => (Array.isArray(d.tables) ? d.tables : []).map((t) => t && t.name ? `${t.name}(${(t.rows || []).length}행)` : ''))).slice(0, 3);
  return {
    app: d0.app || '', screen: uniq(it.map((d) => d.screen)).join(' → '), stage: uniq(it.map((d) => d.businessStage))[0] || '',
    activity: uniq(it.map((d) => d.activity)), purpose: uniq(it.map((d) => d.purpose)), done: uniq(it.map((d) => d.actionDone)), change: uniq(it.map((d) => d.changeFromPrev)),
    next: uniq(it.map((d) => d.nextLikely)).slice(-1)[0] || '', fields, entLine, tables, people: uniq(it.flatMap((d) => [d.handedTo, d.receivedFrom])), hint: uniq(it.map((d) => d.automationHint)).slice(0, 1)[0] || ''
  };
}

function render(tl) {
  const sum = $('#sum'), root = $('#tl');
  if (!tl) { sum.hidden = true; root.innerHTML = '<div class="empty">이 날 데이터가 없습니다 (PC 꺼짐·휴일·데몬 미설치)</div>'; return; }
  const work = mins(tl.start, tl.end); const away = tl.blocks.filter((b) => b.gap).reduce((a, b) => a + b.gap, 0);
  sum.hidden = false;
  sum.innerHTML = `<div><b>${hm(tl.start)}</b><span class="k">출근(첫 활동)</span></div><div><b>${hm(tl.end)}</b><span class="k">퇴근(마지막 활동)</span></div><div><b>${Math.floor(work / 60)}h ${work % 60}m</b><span class="k">체류</span></div><div><b>${away}m</b><span class="k">자리 비움</span></div><div><b>${tl.blocks.filter((b) => !b.gap).length}</b><span class="k">작업 단위</span></div><div><b>${tl.nAn}/${tl.nCap}</b><span class="k">해독/캡처</span></div><div><b>${tl.nKb}</b><span class="k">입력 묶음</span></div>`;
  let h = `<div class="ev mark"><div class="card"><div class="txt"><div class="t">${hm(tl.start)} 출근 <span class="dur">첫 활동 감지</span></div></div></div></div>`;
  for (const b of tl.blocks) {
    if (b.gap) { h += `<div class="ev gap"><div class="gapc">${hm(b.at)} ~ ${hm(b.until)} · 자리 비움 <b>${b.gap}분</b> (활동 없음)</div></div>`; continue; }
    const x = blockText(b); const dur = mins(b.start, b.end);
    const li = (arr) => arr.length ? `<ul>${arr.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : '';
    h += `<div class="ev"><div class="card"><div class="txt">
      <div class="t">${hm(b.start)}${dur ? '–' + hm(b.end) : ''}<span class="dur">${dur ? dur + '분' : '순간'} · 장면 ${b.n}${b.kb ? ' · 입력 ' + b.kb + '회' : ''}</span><span class="app">${esc(x.app)}</span>${x.stage ? `<span class="stage">${esc(x.stage)}</span>` : ''}</div>
      <div class="scr">${esc(x.screen)}</div>
      <dl class="kv">
        ${x.activity.length ? `<dt>활동</dt><dd>${li(x.activity)}</dd>` : ''}
        ${x.purpose.length ? `<dt>목적</dt><dd>${li(x.purpose)}</dd>` : ''}
        ${x.done.length ? `<dt>완료</dt><dd>${li(x.done)}</dd>` : ''}
        ${x.change.length ? `<dt>변화</dt><dd>${li(x.change)}</dd>` : ''}
        ${x.fields.length ? `<dt>입력값</dt><dd>${li(x.fields)}</dd>` : ''}
        ${x.entLine ? `<dt>대상</dt><dd>${esc(x.entLine)}</dd>` : ''}
        ${x.tables.length ? `<dt>표</dt><dd>${esc(x.tables.join(', '))}</dd>` : ''}
        ${x.people.length ? `<dt>주고받음</dt><dd>${esc(x.people.join(', '))}</dd>` : ''}
        ${x.next ? `<dt>다음</dt><dd>${esc(x.next)}</dd>` : ''}
        ${x.hint ? `<dt>자동화</dt><dd>${esc(x.hint)}</dd>` : ''}
      </dl></div>
      ${b.thumb ? `<div class="img"><img loading="lazy" src="data:image/jpeg;base64,${b.thumb}" alt="캡처" title="클릭하면 크게"></div>` : ''}
    </div></div>`;
  }
  h += `<div class="ev off"><div class="card"><div class="txt"><div class="t">${hm(tl.end)} 퇴근 <span class="dur">마지막 활동</span></div></div></div></div>`;
  root.innerHTML = h;
  root.querySelectorAll('.img img').forEach((im) => im.onclick = () => { $('#mimg').src = im.src; $('#modal').style.display = 'flex'; });
}

function plainText(tl) {
  if (!tl) return '(데이터 없음)';
  const L = [`${me.name} · ${day} (${DOW[kst(day + 'T00:00:00+09:00').getUTCDay()]})`, `${hm(tl.start)} 출근`];
  for (const b of tl.blocks) {
    if (b.gap) { L.push(`${hm(b.at)}~${hm(b.until)} 자리 비움 ${b.gap}분`); continue; }
    const x = blockText(b); L.push(`${hm(b.start)}–${hm(b.end)} [${x.app}${x.stage ? '/' + x.stage : ''}] ${x.screen}`);
    for (const [k, v] of [['활동', x.activity], ['목적', x.purpose], ['완료', x.done], ['변화', x.change], ['입력값', x.fields]]) if (v.length) L.push(`  ${k}: ${v.join(' / ')}`);
    if (x.entLine) L.push(`  대상: ${x.entLine}`); if (x.next) L.push(`  다음: ${x.next}`);
  }
  L.push(`${hm(tl.end)} 퇴근`); return L.join('\n');
}

let curTl = null;
async function loadDay() {
  if (!me || !day) return; $('#tl').innerHTML = '<div class="empty">불러오는 중…</div>';
  const data = await fetchDay(me.userId, day); curTl = buildTimeline(data); render(curTl);
}
async function loadWeek() {
  const days = [1, 2, 3, 4, 5].map((i) => ymd(addDays(weekMon, i - 1)));
  $('#wlabel').textContent = `${days[0].slice(5).replace('-', '/')} ~ ${days[4].slice(5).replace('-', '/')}`;
  if (!day || !days.includes(day)) { const today = ymd(kst(Date.now())); day = days.includes(today) ? today : days[4]; }
  const D = $('#days'); D.innerHTML = days.map((d, i) => `<button data-d="${d}" class="${d === day ? 'on' : ''}">${DOW[i + 1]}<small>${d.slice(5).replace('-', '/')}</small></button>`).join('');
  D.querySelectorAll('button').forEach((b) => b.onclick = () => { day = b.dataset.d; D.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); loadDay(); });
  loadDay();
  // 요일 점: 데이터 있는 날 표시(백그라운드)
  if (me) for (const d of days) fetchDay(me.userId, d).then((r) => { if (r.an.length || r.cap.length) D.querySelector(`[data-d="${d}"]`)?.classList.add('has'); });
}
$('#prevW').onclick = () => { weekMon = addDays(weekMon, -7); day = null; loadWeek(); };
$('#nextW').onclick = () => { weekMon = addDays(weekMon, 7); day = null; loadWeek(); };
$('#thisW').onclick = () => { weekMon = mondayOf(kst(Date.now())); day = null; loadWeek(); };
$('#reload').onclick = () => { cache = {}; loadDay(); };
$('#copyTxt').onclick = async () => { await navigator.clipboard.writeText(plainText(curTl)); $('#copyTxt').textContent = '복사됨'; setTimeout(() => $('#copyTxt').textContent = '텍스트 복사', 1500); };
$('#modal').onclick = () => $('#modal').style.display = 'none';

(async () => { weekMon = mondayOf(kst(Date.now())); await loadPeople(); if (me) loadWeek(); })();
</script>
</body>
</html>
