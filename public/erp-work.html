<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전산 실제 처리</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e3e0;--ok:#1f8a4c;--warn:#b26b00;--bad:#b3261e;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0e1016;--panel:#161922;--ink:#e8e8ea;--sub:#9a9ca5;--line:#2a2e3a;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--chip:#1f2430}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}h1{font-size:20px;margin:0 0 4px}.lede{color:var(--sub);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.card b{display:block;font-size:22px}.card span{color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--sub);font-weight:600;background:var(--chip)}
td.n{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.sub{color:var(--sub);font-size:12px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--ok)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}select,button{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<main id="m"><h1>전산 실제 처리</h1><p class="lede">불러오는 중…</p></main>
<script>
{ const q = new URLSearchParams(location.search), t = q.get('token'); if (t) { localStorage.setItem('orbit_token', t); localStorage.setItem('orbitToken', t); q.delete('token'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } }
const tok = localStorage.getItem('orbit_token') || localStorage.getItem('orbitToken') || '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0);
const mmss = (s) => (s >= 60 ? Math.floor(s / 60) + '분 ' : '') + (s % 60) + '초';
let who = '';
async function load(days) {
  const m = document.getElementById('m');
  const r = await fetch('/api/flow/erp-work?days=' + days, { headers: { Authorization: 'Bearer ' + tok } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { m.innerHTML = '<h1>전산 실제 처리</h1><p class="lede">' + (r.status === 403 ? '관리자 계정만 볼 수 있습니다.' : r.status === 401 ? '로그인이 필요합니다. 네노바웹 내 작업 데이터 화면에서 열어 주세요.' : '불러오기 실패: ' + esc(j.error || r.status)) + '</p>'; return; }
  const P = j.people || [];
  const tot = P.reduce((a, p) => ({ s: a.s + p.saves, m: a.m + p.matched, nc: a.nc + p.noChange, t: a.t + p.typed, tc: a.tc + p.typedChecked }), { s: 0, m: 0, nc: 0, t: 0, tc: 0 });
  const rec = (j.recent || []).filter((x) => !who || x.name === who);
  m.innerHTML = `
  <h1>전산 실제 처리</h1>
  <p class="lede">직원이 전산(nenova)에서 저장·확정한 동작을, 같은 시각 실제 전산 주문·출고 변경 기록과 맞춘 결과입니다. 최근 ${j.days}일 · ${esc(String(j.generatedAt).slice(0, 16).replace('T', ' '))} 기준(UTC).</p>
  <div class="tools"><label>기간 <select id="d">${[1, 3, 7, 14].map((d) => `<option value="${d}" ${d === j.days ? 'selected' : ''}>${d}일</option>`).join('')}</select></label>
  <label>직원 <select id="w"><option value="">전체</option>${P.map((p) => `<option ${p.name === who ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>
  <div class="cards">
    <div class="card"><b>${tot.s}</b><span>전산 저장·확정 동작</span></div>
    <div class="card"><b class="ok">${tot.m} <small>(${pct(tot.m, tot.s)}%)</small></b><span>실제 전산 변경과 일치</span></div>
    <div class="card"><b class="warn">${tot.nc}</b><span>저장했는데 전산 변경 없음</span></div>
    <div class="card"><b>${tot.t} / ${tot.tc}</b><span>직접 친 거래처·품목 확인 / 키보드 입력 있던 건</span></div>
  </div>
  <div class="wrap"><table><thead><tr><th>직원</th><th class="n">저장 동작</th><th>전산 일치</th><th class="n">변경 없음</th><th class="n">건당 시간</th><th class="n">직접 입력 확인</th><th>주로 처리한 거래처</th><th>주 화면</th></tr></thead><tbody>
  ${P.map((p) => `<tr><td><b>${esc(p.name)}</b></td><td class="n">${p.saves}</td>
   <td><div class="sub">${p.matched}건 · ${pct(p.matched, p.saves)}%</div><div class="bar"><i style="width:${pct(p.matched, p.saves)}%"></i></div></td>
   <td class="n ${p.noChange ? 'warn' : ''}">${p.noChange}</td><td class="n">${p.matched ? mmss(p.avgSec) : '-'}</td>
   <td class="n">${p.typedChecked ? p.typed + ' / ' + p.typedChecked : '-'}</td>
   <td>${p.customers.map((c) => `<span class="chip">${esc(c.n)} ${c.c}</span>`).join('') || '<span class="sub">-</span>'}</td>
   <td>${p.screens.map((c) => `<span class="chip">${esc(c.n)} ${c.c}</span>`).join('') || '<span class="sub">-</span>'}</td></tr>`).join('')}
  </tbody></table></div>
  <h2 style="font-size:16px;margin:18px 0 8px">최근 처리 내역 ${who ? '· ' + esc(who) : ''}</h2>
  <div class="wrap"><table><thead><tr><th>시각(KST)</th><th>직원</th><th>화면 · 단계</th><th>전산 결과</th><th>거래처 · 품목</th><th>직접 입력</th></tr></thead><tbody>
  ${rec.slice(0, 120).map((x) => `<tr><td class="sub">${esc(x.at)}</td><td>${esc(x.name)}</td>
   <td><b>${esc(x.screen || '-')}</b><div class="sub">${esc(x.steps.join(' → '))}${x.sec ? ' · ' + mmss(x.sec) : ''}${x.apps.length > 1 ? ' · ' + esc(x.apps.join('+')) : ''}</div></td>
   <td>${x.matched ? `<span class="ok">일치</span> <span class="sub">${esc(x.kinds.map((k) => (k === 'order' ? '주문' : '출고')).join('·'))} ${x.rows}건 ${esc(x.weeks.join(','))}</span>` : x.reason === 'no_change' ? '<span class="warn">변경 없음</span>' : '<span class="sub">대조 대상 아님</span>'}</td>
   <td>${x.customers.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}<div class="sub">${esc(x.items.join(' / '))}</div></td>
   <td>${x.typed && x.typed.confirmed ? '<span class="ok">확인</span>' : x.typed ? '<span class="sub">입력은 있음</span>' : '<span class="sub">-</span>'}</td></tr>`).join('') || '<tr><td colspan="6" class="sub">내역 없음</td></tr>'}
  </tbody></table></div>
  <p class="sub">대조 방식: 저장 동작 앞 30초~뒤 60초 안의 전산 변경 중 그 직원 계정(nenova 로그인 ID)이 바꾼 것. 직접 입력 확인은 같은 시각 키보드 입력(한글 변환)에 그 거래처·품목 이름이 있는지로 판단하며, 입력 원문은 저장하지 않습니다. 입고·견적 화면 저장은 아직 대조 대상이 아닙니다.</p>`;
  document.getElementById('d').onchange = (e) => load(+e.target.value);
  document.getElementById('w').onchange = (e) => { who = e.target.value; load(j.days); };
}
load(7);
</script>
</body>
</html>
