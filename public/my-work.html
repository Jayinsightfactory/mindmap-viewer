<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 작업 데이터</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#2a3240;--txt:#e6edf3;--muted:#8b949e;--acc:#58a6ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,'Malgun Gothic',sans-serif;font-size:13px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
h1{font-size:15px;margin:0;white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;font-family:inherit}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--txt);border-color:var(--acc);background:#1c2633}
nav .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.right a{color:var(--muted);text-decoration:none;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.right a:hover{color:var(--txt);border-color:var(--acc)}
#tokenbar{display:none;padding:8px 14px;background:#2a1f13;border-bottom:1px solid #5a4020;color:#e3b341;font-size:12px;gap:8px;align-items:center;flex:0 0 auto}
#tokenbar input{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:320px;font-family:inherit}
#tokenbar button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}
#stage{flex:1 1 auto;position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#stage iframe.on{display:block}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>내 작업 데이터</h1>
  <nav id="tabs"></nav>
  <div class="right" data-site-nav></div>
  <script src="/js/site-nav.js"></script>
</header>
<div id="tokenbar">
  <span>관리자 토큰이 없습니다. 일부 탭이 비어 보입니다.</span>
  <input id="tokin" placeholder="orbit_… 토큰 붙여넣기">
  <button id="toksave">저장</button>
</div>
<div id="stage"><div id="empty">불러오는 중…</div></div>
<script>
// 각 탭 = 기존 페이지를 그대로 iframe으로 띄운다 (같은 오리진이라 localStorage orbit_token 공유)
const TABS = [
  { id: 'timetable', label: '시간표 (일·주·월)', src: '/work-timetable.html' },
  { id: 'screens',   label: '화면 타임라인',      src: '/cctv.html' },
  { id: 'detail',    label: '작업 상세',          src: '/work-detail.html' },
  { id: 'purpose',   label: '목적 타임라인',      src: '/orbit-timeline.html' },
  { sep: true },
  { id: 'deepdive',  label: '세밀분석',           src: '/deepdive.html' },
  { id: 'logs',      label: '작업 로그',          src: '/work-logs.html' },
  { id: 'analysis',  label: '작업 분석',          src: '/analysis.html' },
  { id: 'mining',    label: '프로세스 마이닝',     src: '/process-mining.html' },
  { sep: true },
  { id: 'erp',       label: '전산(nenova)',       src: '/nenova-dashboard.html' },
  { id: 'orderflow', label: '발주 검증',          src: '/orderflow.html' },
  { id: 'xray',      label: 'X-ray',              src: '/xray.html' },
];

const stage = document.getElementById('stage');
const tabsEl = document.getElementById('tabs');
const frames = {};
let current = null;

for (const t of TABS) {
  if (t.sep) { const s = document.createElement('span'); s.className = 'sep'; tabsEl.appendChild(s); continue; }
  const b = document.createElement('button');
  b.textContent = t.label;
  b.dataset.id = t.id;
  b.onclick = () => show(t.id);
  tabsEl.appendChild(b);
}

function show(id) {
  const tab = TABS.find((t) => t.id === id);
  if (!tab) return;
  if (!frames[id]) { // 지연 로딩 — 누른 탭만 실제로 fetch한다
    const f = document.createElement('iframe');
    f.src = tab.src;
    f.title = tab.label;
    stage.appendChild(f);
    frames[id] = f;
    const empty = document.getElementById('empty');
    if (empty) empty.remove();
  }
  for (const [k, f] of Object.entries(frames)) f.classList.toggle('on', k === id);
  for (const b of tabsEl.querySelectorAll('button')) b.classList.toggle('on', b.dataset.id === id);
  current = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  document.title = tab.label + ' · 내 작업 데이터';
}

// 토큰 없으면 입력 바 노출 (?token= 로 들어오면 저장하고 넘어간다)
const qsTok = new URLSearchParams(location.search).get('token');
if (qsTok) localStorage.setItem('orbit_token', qsTok);
if (!localStorage.getItem('orbit_token')) document.getElementById('tokenbar').style.display = 'flex';
document.getElementById('toksave').onclick = () => {
  const v = document.getElementById('tokin').value.trim();
  if (!v) return;
  localStorage.setItem('orbit_token', v);
  localStorage.setItem('orbitToken', v); // cctv.html이 쓰는 옛 키도 함께 채운다
  location.reload();
};

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current) show(h); });
show(location.hash.slice(1) || 'timetable');
</script>
</body>
</html>
