<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사장님 브리핑 · MOYI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c1116;--panel:#141b22;--line:#212b35;--txt:#e8eef4;--muted:#6f7d8c;--acc:#2dd4bf;--gold:#e0b64a;--bad:#f85149;--warn:#e08a4a}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:19px}.sub{color:var(--muted);font-size:12px}
button{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;margin-left:auto}
.headline{background:linear-gradient(150deg,#12332e,#141b22);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;margin:14px 0}
h2{font-size:14px;color:var(--acc);margin:22px 0 10px}
.pri{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.pri .r{font-size:22px;font-weight:800;color:var(--acc)}
.pri b{font-size:15px}.pri .why{color:var(--muted);font-size:12.5px;margin:3px 0}
.pri .act{color:var(--txt);font-size:13px;margin-top:5px;padding:7px 10px;background:#12332e33;border-left:2px solid var(--acc);border-radius:6px}
.pri .sens{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:0 6px;margin-left:6px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border:none}
.badge{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.ask{background:#2a1c10;border:1px solid #4a3c16;border-radius:12px;padding:12px 15px;color:#e6c25a;font-size:13px}
.ask li{margin:4px 0 4px 16px}
.muted{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:50px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🧭 사장님 브리핑</h1><span class="sub">회사 데이터를 사장님 관점으로 — 오늘 챙길 것</span><button onclick="load()">새로고침</button></header>
<div id="root"><div class="empty">불러오는 중…</div></div>
</div>
<script>
const TK=localStorage.getItem('orbit_token')||new URLSearchParams(location.search).get('token')||'';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  const root=document.getElementById('root'); root.innerHTML='<div class="empty">불러오는 중…</div>';
  let d; try{ d=await fetch('/api/flow/ops-report?kind=owner-brief',{headers:TK?{Authorization:'Bearer '+TK}:{}}).then(r=>r.json()); }
  catch(e){ root.innerHTML='<div class="empty">로드 실패</div>'; return; }
  const r=d&&d.latest&&d.latest.report;
  if(!r){ root.innerHTML='<div class="empty">아직 브리핑이 없습니다 — owner PC에서 node bin/owner-agent.js 실행</div>'; return; }
  const grade=v=>v>=38?'#f85149':v>=28?'#e0b64a':'#3fb950';
  let h=`<div class="headline">${esc(r.headline||'')}</div><div class="muted">생성 ${esc(String(d.latest.ts||'').slice(0,16))} · ${esc(r.asOf||'')}</div>`;
  h+=`<h2>🎯 오늘 챙길 것</h2>`;
  (r.priorities||[]).forEach(p=>{ h+=`<div class="pri"><div class="r">${p.rank||''}</div><div>
    <b>${esc(p.what)}</b>${p.sensitive?'<span class="sens">민감·실행은 사람이</span>':''}
    <div class="why">${esc(p.why||'')} ${p.who?'· '+esc(p.who):''}</div>
    <div class="act">▸ ${esc(p.action||'')}</div></div></div>`; });
  if((r.watchCustomers||[]).length){ h+=`<h2>🚨 지금 챙길 거래처</h2><div class="card">`;
    r.watchCustomers.forEach(c=>{ h+=`<div class="row"><span class="badge" style="background:${grade(c.risk)}22;color:${grade(c.risk)}">${c.risk}</span><b>${esc(c.name)}</b><span class="muted">${esc(c.why||'')}</span></div>`; });
    h+=`</div>`; }
  if((r.quickWins||[]).length){ h+=`<h2>⚡ 빠른 성과(자동화)</h2><div class="card">`;
    r.quickWins.forEach(q=>{ h+=`<div class="row"><b>${esc(q.task)}</b><span class="muted">${esc(q.tool||'')} · ${esc(q.save||'')}</span></div>`; });
    h+=`</div>`; }
  if((r.askOwner||[]).length){ h+=`<h2>🙋 사장님 결정 필요</h2><div class="ask"><ul>${r.askOwner.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; }
  if((r.blindSpots||[]).length){ h+=`<h2 style="color:var(--warn)">🌫 오늘 못 본 것</h2><div class="card muted">${r.blindSpots.map(esc).join(' · ')}</div>`; }
  root.innerHTML=h;
}
load();
</script>
</body>
</html>
