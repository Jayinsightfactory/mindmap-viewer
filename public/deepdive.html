<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>세밀분석 — 작업 재구성</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#bc8cff; --teal:#39d2c0;
    --warn:#f0883e; --danger:#f85149; --good:#3fb950;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;font-size:13px;line-height:1.55}
  a{color:var(--accent)}
  .wrap{display:flex;height:100vh;overflow:hidden}
  /* 좌측 인물 목록 */
  .side{width:240px;flex:0 0 240px;border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:10px}
  .side h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 8px 10px}
  .person{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
  .person:hover{background:var(--panel2)}
  .person.active{background:var(--panel2);border-color:var(--accent)}
  .person .nm{font-weight:600;font-size:14px}
  .person .sub{color:var(--muted);font-size:11px;margin-top:3px}
  .person .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(63,185,80,.15);color:var(--good);margin-left:4px}
  /* 우측 상세 */
  .main{flex:1;overflow-y:auto;padding:22px 26px}
  .empty{color:var(--muted);padding:60px 20px;text-align:center}
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .head h1{font-size:22px;margin:0}
  .head .meta{color:var(--muted);font-size:12px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:120px}
  .kpi .n{font-size:20px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:11px;margin-top:2px}
  .summary{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:22px}
  .sec-title{font-size:13px;font-weight:700;color:var(--text);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .sec-title .cnt{color:var(--muted);font-weight:400;font-size:12px}
  /* 반복작업 카드 = 추론체인 */
  .task{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .task .t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .task .t-name{font-weight:700;font-size:14px}
  .task .t-badges{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
  .tag{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .tag.auto{background:rgba(188,140,255,.15);color:var(--accent)}
  .tag.min{background:rgba(57,210,192,.15);color:var(--teal)}
  .tag.rel-100{background:rgba(63,185,80,.15);color:var(--good)}
  .tag.rel-step{background:rgba(57,210,192,.15);color:var(--teal)}
  .tag.rel-bad{background:rgba(139,148,158,.15);color:var(--muted)}
  .tag.diff{background:rgba(240,136,62,.13);color:var(--warn)}
  .chain{display:grid;grid-template-columns:76px 1fr;gap:2px 12px;font-size:12.5px}
  .chain dt{color:var(--muted);text-align:right;padding:3px 0}
  .chain dd{margin:0;padding:3px 0}
  .chain dd.rule{color:#ffd9a3;background:rgba(240,136,62,.08);border-radius:5px;padding:5px 8px}
  .chain .arrow{grid-column:1/3;color:var(--border);text-align:center;font-size:10px;line-height:.6}
  /* 워크플로우 트레이스 = 앱→앱 순차 흐름 */
  .cat-head{font-size:12px;font-weight:700;color:var(--teal);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.4px}
  .wf{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .wf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  .wf-name{font-weight:700;font-size:14.5px}
  .wf-trigger{color:var(--muted);font-size:11.5px;margin-bottom:12px}
  .wf-trigger b{color:var(--text);font-weight:600}
  .flow{display:flex;flex-direction:column;gap:0;margin:8px 0 12px}
  .step{display:grid;grid-template-columns:20px auto 1fr;gap:0 10px;align-items:start}
  .step .rail{display:flex;flex-direction:column;align-items:center}
  .step .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:4px;flex:0 0 auto}
  .step .line{width:2px;flex:1;background:var(--border);min-height:14px}
  .step:last-child .line{display:none}
  .step .appbox{display:inline-block;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;white-space:nowrap;margin-bottom:8px}
  .step .body{padding-bottom:8px}
  .step .act{font-size:13px}
  .step .data{color:var(--teal);font-size:12px;margin-top:2px}
  .step .ev{color:var(--muted);font-size:10.5px;margin-top:1px}
  .wf-io{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;margin-top:4px}
  .wf-io .io{background:var(--panel2);border-radius:6px;padding:4px 9px}
  .wf-io .io b{color:var(--muted);font-weight:600;margin-right:4px}
  .wf-rule{color:#ffd9a3;background:rgba(240,136,62,.08);border-radius:6px;padding:6px 9px;font-size:12px;margin-top:8px}
  .wf-blind{color:var(--warn);font-size:11.5px;margin-top:6px}
  /* 리스트 섹션 */
  ul.plain{margin:0;padding:0;list-style:none}
  ul.plain li{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:7px}
  ul.plain li .rule-tag{color:var(--muted);font-size:11px;display:block;margin-top:3px}
  .blind li{border-left:3px solid var(--warn)}
  .blind li b{color:var(--warn)}
  .feat li{border-left:3px solid var(--accent)}
  .refresh{position:fixed;top:14px;right:18px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px}
  .refresh:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h2>세밀분석 대상</h2>
    <div id="people"><div class="empty" style="padding:20px;font-size:12px">불러오는 중…</div></div>
  </div>
  <div class="main" id="main">
    <div class="empty">왼쪽에서 인물을 선택하세요.</div>
  </div>
</div>
<button class="refresh" onclick="load(true)">↻ 새로고침</button>
<script>
const TOKEN = localStorage.getItem('orbit_token') || sessionStorage.getItem('orbit_flow_token') || '';
const H = { Authorization: 'Bearer ' + TOKEN };
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let REPORTS = [];

function relClass(r){ r=String(r||''); if(r.includes('100'))return'rel-100'; if(r.includes('부적합')||r.includes('SOP'))return'rel-bad'; return'rel-step'; }

async function load(force){
  const peopleEl = document.getElementById('people');
  // 1) 이름 원장
  let users=[];
  try{ users = (await fetch('/api/admin/all-users',{headers:H}).then(r=>r.json())).users||[]; }catch(e){}
  const nameById={}; users.forEach(u=>{ if(u.id) nameById[u.id]=u.name; });
  // 2) 각 계정 deepdive 조회 (있는 것만)
  const ids = users.map(u=>u.id);
  const got = await Promise.all(ids.map(id =>
    fetch('/api/flow/ops-report?kind=deepdive:'+encodeURIComponent(id),{headers:H})
      .then(r=>r.json()).then(d=>({id, row:d&&d.latest})).catch(()=>({id,row:null}))
  ));
  REPORTS = got.filter(g=>g.row&&g.row.report).map(g=>{
    const rep=g.row.report;
    const nm = (rep.userName && !/�/.test(rep.userName) && rep.userName) || nameById[g.id] || g.id.slice(0,10);
    const saveMin=(rep.repetitiveTasks||[]).reduce((a,t)=>a+(+t.estWeeklyMin||0),0);
    return { id:g.id, name:nm, ts:g.row.ts, rep, tasks:(rep.repetitiveTasks||[]).length, saveMin, refined:!!rep.refinedFromPrev };
  }).sort((a,b)=>b.saveMin-a.saveMin);

  if(!REPORTS.length){ peopleEl.innerHTML='<div class="empty" style="padding:20px;font-size:12px">세밀분석 결과가 없습니다.</div>'; return; }
  peopleEl.innerHTML = REPORTS.map((r,i)=>`
    <div class="person${i===0?' active':''}" onclick="sel(${i},this)">
      <div class="nm">${esc(r.name)}${r.refined?'<span class="badge">자기개선</span>':''}</div>
      <div class="sub">반복작업 ${r.tasks} · 주 ${Math.round(r.saveMin/60*10)/10}h 절감추정</div>
    </div>`).join('');
  render(REPORTS[0]);
}
function sel(i,el){ document.querySelectorAll('.person').forEach(p=>p.classList.remove('active')); el.classList.add('active'); render(REPORTS[i]); }

function taskCard(t){
  const rows=[];
  const add=(k,v,cls)=>{ if(v) rows.push(`<dt>${k}</dt><dd class="${cls||''}">${esc(v)}</dd>`); };
  add('소스', t.source); add('추출', t.extract); add('입력', t.inputTo); add('분류', t.classifyBy);
  add('★규칙', t.rule, 'rule'); add('구현', t.how); add('근거', t.evidence);
  const badges=[];
  if(t.autoMethod) badges.push(`<span class="tag auto">${esc(t.autoMethod)}</span>`);
  if(t.reliability) badges.push(`<span class="tag ${relClass(t.reliability)}">${esc(t.reliability)}</span>`);
  if(t.difficulty) badges.push(`<span class="tag diff">난이도 ${esc(t.difficulty)}</span>`);
  if(t.estWeeklyMin) badges.push(`<span class="tag min">주 ${esc(t.estWeeklyMin)}분</span>`);
  return `<div class="task"><div class="t-top"><div class="t-name">${esc(t.task)}</div>
    <div class="t-badges">${badges.join('')}</div></div>
    <dl class="chain">${rows.join('<div class="arrow">▾</div>')}</dl></div>`;
}

function stepRow(s){
  return `<div class="step">
    <div class="rail"><div class="dot"></div><div class="line"></div></div>
    <div class="appbox">${esc(s.app||'')}</div>
    <div class="body">
      <div class="act">${esc(s.action||'')}</div>
      ${s.data?`<div class="data">▸ ${esc(s.data)}</div>`:''}
      ${s.evidence?`<div class="ev">${esc(s.evidence)}</div>`:''}
    </div>
  </div>`;
}
function wfCard(w){
  const badges=[];
  if(w.autoMethod) badges.push(`<span class="tag auto">${esc(w.autoMethod)}</span>`);
  if(w.reliability) badges.push(`<span class="tag ${relClass(w.reliability)}">${esc(w.reliability)}</span>`);
  if(w.difficulty) badges.push(`<span class="tag diff">난이도 ${esc(w.difficulty)}</span>`);
  if(w.estWeeklyMin) badges.push(`<span class="tag min">주 ${esc(w.estWeeklyMin)}분</span>`);
  const steps=(w.steps||[]).slice().sort((a,b)=>(+a.seq||0)-(+b.seq||0));
  const inputs=(w.inputs||[]).map(esc).join(', ');
  const blind=(w.blindSpots||[]);
  return `<div class="wf">
    <div class="wf-top"><div class="wf-name">${esc(w.name||'업무')}</div><div class="t-badges">${badges.join('')}</div></div>
    ${w.trigger?`<div class="wf-trigger">시작 신호: <b>${esc(w.trigger)}</b>${w.frequency?` · ${esc(w.frequency)}`:''}</div>`:''}
    <div class="flow">${steps.map(stepRow).join('') || '<div class="ev" style="padding-left:30px">단계 미복원</div>'}</div>
    <div class="wf-io">
      ${inputs?`<div class="io"><b>입력</b>${inputs}</div>`:''}
      ${w.output?`<div class="io"><b>산출물</b>${esc(w.output)}</div>`:''}
    </div>
    ${w.rule?`<div class="wf-rule">★규칙: ${esc(w.rule)}</div>`:''}
    ${blind.length?`<div class="wf-blind">⚠ 미확인: ${blind.map(esc).join(' · ')}</div>`:''}
  </div>`;
}
function render(r){
  const rep=r.rep;
  const wfs=(rep.workflows||[]);
  const oldTasks=(rep.repetitiveTasks||[]);
  const rules=(rep.classificationRules||[]);
  const feats=(rep.nenovawebFeatures||[]);
  const blind=(rep.blindSpots||[]);
  const tsStr = r.ts ? new Date(r.ts).toLocaleString('ko-KR') : '';
  const totalSteps = wfs.reduce((a,w)=>a+(w.steps||[]).length,0);
  // 업무분류(category)별 그룹핑
  let flowHtml='';
  if(wfs.length){
    const byCat={}; wfs.forEach(w=>{ const c=w.category||'기타'; (byCat[c]=byCat[c]||[]).push(w); });
    flowHtml = Object.keys(byCat).map(c=>
      `<div class="cat-head">▸ ${esc(c)} <span style="color:var(--muted);font-weight:400">${byCat[c].length}</span></div>`+
      byCat[c].map(wfCard).join('')
    ).join('');
  } else {
    flowHtml = oldTasks.map(taskCard).join('') || '<div class="empty" style="text-align:left">업무 흐름 없음 — 재분석 필요</div>';
  }
  const headCnt = wfs.length || oldTasks.length;
  const headLbl = wfs.length ? '업무 흐름' : '반복 작업';
  document.getElementById('main').innerHTML = `
    <div class="head">
      <h1>${esc(r.name)}</h1>
      ${r.refined?'<span class="badge" style="background:rgba(63,185,80,.15);color:var(--good);padding:2px 8px;border-radius:10px;font-size:11px">자기개선 반영</span>':''}
      <span class="meta">갱신 ${esc(tsStr)}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n">${headCnt}</div><div class="l">${headLbl}</div></div>
      ${wfs.length?`<div class="kpi"><div class="n">${totalSteps}</div><div class="l">복원 단계</div></div>`:''}
      <div class="kpi"><div class="n">${rules.length}</div><div class="l">분류 규칙</div></div>
      <div class="kpi"><div class="n">${feats.length}</div><div class="l">웹기능 후보</div></div>
      <div class="kpi"><div class="n">${Math.round(r.saveMin/60*10)/10}h</div><div class="l">주간 절감추정</div></div>
      <div class="kpi"><div class="n" style="color:var(--warn)">${blind.length}</div><div class="l">미확인·추정</div></div>
    </div>
    ${rep.summary?`<div class="summary">${esc(rep.summary)}</div>`:''}
    <div class="sec-title">🔀 업무 흐름 — 앱→앱 순차 복원 <span class="cnt">${wfs.length?`${wfs.length}개 흐름 · ${totalSteps}단계`:'구(舊)형식 — 재분석 시 흐름으로 전환'}</span></div>
    ${flowHtml}
    ${rules.length?`<div class="sec-title">📐 분류·판단 규칙 <span class="cnt">${rules.length}건</span></div>
      <ul class="plain">${rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${feats.length?`<div class="sec-title">🛠️ 네노바웹 기능 후보 <span class="cnt">${feats.length}건</span></div>
      <ul class="plain feat">${feats.map(f=>`<li>${esc(f.feature||f)}${f.rule?`<span class="rule-tag">규칙: ${esc(f.rule)}</span>`:''}</li>`).join('')}</ul>`:''}
    ${blind.length?`<div class="sec-title" style="color:var(--warn)">⚠️ 미확인·추정 (AI가 스스로 표시한 한계) <span class="cnt">${blind.length}건 — 여기가 부족한 지점</span></div>
      <ul class="plain blind">${blind.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  `;
}
load();
</script>
</body>
</html>
