<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카톡 인텔리전스 · 네노바</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3240; --txt:#e6edf3; --dim:#8b949e; --accent:#4c9aff; --ok:#2ea043; --warn:#d29922; --bad:#f85149; --auto:#a371f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif; font-variant-numeric:tabular-nums; font-size:14px; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:10; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  .ctrl { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, button, input[type="search"] { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:13px; font-family:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .kpis { display:flex; gap:12px; padding:14px 22px; flex-wrap:wrap; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:120px; }
  .kpi .n { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .kpi .l { color:var(--dim); font-size:12px; margin-top:2px; }
  .tabs { display:flex; gap:6px; padding:0 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab { padding:10px 14px; border:none; background:none; color:var(--dim); border-bottom:2px solid transparent; border-radius:0; }
  .tab.active { color:var(--txt); border-bottom-color:var(--accent); }
  .view { padding:18px 22px; display:none; }
  .view.active { display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  tbody tr:not(.det-row) { content-visibility:auto; contain-intrinsic-size:0 42px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; position:sticky; top:64px; background:var(--bg); }
  tr:hover td { background:var(--panel); }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .b-ok { background:rgba(46,160,67,.16); color:#3fb950; }
  .b-bad { background:rgba(248,81,73,.16); color:#ff7b72; }
  .b-warn { background:rgba(210,153,34,.16); color:#e3b341; }
  .alertbar { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mini { background:var(--panel2); border:1px solid var(--line); color:var(--accent); font-size:11.5px; padding:3px 9px; border-radius:7px; cursor:pointer; }
  .mini:hover { border-color:var(--accent); }
  .b-auto { background:rgba(163,113,247,.16); color:#b98eff; }
  .b-hum { background:rgba(210,153,34,.16); color:#e3b341; }
  .chip { display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:1px 7px; margin:2px 3px 0 0; font-size:11px; color:var(--dim); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h3 { margin:0 0 10px; font-size:14px; }
  .card h3 .cnt { color:var(--dim); font-weight:400; font-size:12px; }
  .rule { padding:8px 0; border-bottom:1px solid var(--line); content-visibility:auto; contain-intrinsic-size:0 36px; }
  .rule:last-child { border:none; }
  .rule .ev { color:var(--dim); font-size:11px; margin-top:3px; }
  .muted { color:var(--dim); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .more-wrap { padding:12px; text-align:center; }
  @media(max-width:820px){ .grid2{grid-template-columns:1fr;} th{position:static;} }
</style>
</head>
<body>
<header>
  <div><h1>카톡 인텔리전스</h1><div class="sub">거래처 대응 · 이슈 현황 (불량/불만 제외) — 카톡 원문 분석</div></div>
  <div class="ctrl">
    <input type="search" id="search" placeholder="거래처·품목·담당 즉시 검색" aria-label="결과 즉시 검색" style="min-width:190px">
    <select id="hours">
      <option value="720">최근 30일</option>
      <option value="2160">최근 90일</option>
      <option value="8760" selected>전체</option>
    </select>
    <button id="refresh">새로고침</button>
  </div>
</header>
<div class="kpis" id="kpis"></div>
<div class="tabs" id="tabs">
  <button class="tab active" data-v="health">거래처 조기경보</button>
  <button class="tab" data-v="issues">이슈 대응보드</button>
  <button class="tab" data-v="customers">거래처 대응</button>
  <button class="tab" data-v="employees">직원 역량매트릭스</button>
  <button class="tab" data-v="playbook">해결 플레이북 · 자동화후보</button>
</div>
<div class="view active" id="v-health"></div>
<div class="view" id="v-issues"></div>
<div class="view" id="v-playbook"></div>
<div class="view" id="v-customers"></div>
<div class="view" id="v-employees"></div>

<script>
const TOKEN = localStorage.getItem('orbit_token') || new URLSearchParams(location.search).get('token') || '';
const PAGE_SIZE = 100;
const CACHE_TTL_MS = 5 * 60 * 1000;
const _intelCache = new Map();
let _arCacheAt = 0;
let _currentData = null;
const _limits = { health: PAGE_SIZE, issues: PAGE_SIZE, customers: PAGE_SIZE, employees: PAGE_SIZE };

const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct = v => v==null ? '—' : Math.round(v*100)+'%';
const chips = arr => (arr||[]).map(x=>`<span class="chip">${esc(x.k)} ${x.v}</span>`).join('') || '<span class="muted">—</span>';
const currentQuery = () => (document.getElementById('search').value || '').trim().toLowerCase();

function resetLimits() {
  _limits.health = PAGE_SIZE;
  _limits.issues = PAGE_SIZE;
  _limits.customers = PAGE_SIZE;
  _limits.employees = PAGE_SIZE;
}

function moreButton(section, shownCount, totalCount) {
  if (totalCount <= shownCount) return '';
  return `<div class="more-wrap"><button type="button" onclick="loadMoreSection('${section}')">더 보기 (+${PAGE_SIZE}건 · ${shownCount}/${totalCount}건 표시)</button></div>`;
}

function loadMoreSection(section) {
  _limits[section] = (_limits[section] || PAGE_SIZE) + PAGE_SIZE;
  if (!_currentData) return;
  if (section === 'health') renderHealth(_currentData);
  else if (section === 'issues') renderIssues(_currentData);
  else if (section === 'customers') renderCustomers(_currentData);
  else if (section === 'employees') renderEmployees(_currentData);
}

async function load(fresh = false) {
  const hours = document.getElementById('hours').value;
  resetLimits();
  const now = Date.now();
  const cached = _intelCache.get(hours);
  let d = (!fresh && cached && cached.expiresAt > now) ? cached.data : null;
  if (!d) {
    for (const id of ['v-health','v-issues','v-playbook','v-customers','v-employees']) document.getElementById(id).innerHTML = '<div class="empty">불러오는 중…</div>';
    try {
      const res = await fetch('/api/admin/kakao-intel?hours='+hours+(fresh?'&fresh=1':''), { headers: TOKEN ? { 'Authorization':'Bearer '+TOKEN } : {} });
      d = await res.json();
    } catch(e) { document.getElementById('v-issues').innerHTML = '<div class="empty">로드 실패: '+esc(e.message)+'</div>'; return; }
    if (d.error) { document.getElementById('v-issues').innerHTML = '<div class="empty">'+esc(d.error)+'</div>'; return; }
    _intelCache.set(hours, { data: d, expiresAt: Date.now() + CACHE_TTL_MS });
  }
  _currentData = d;
  await loadReceivables(fresh);
  renderAll();
}

function renderAll() {
  if (!_currentData) return;
  renderKpis(_currentData);
  renderIssues(_currentData);
  renderPlaybook(_currentData);
  renderCustomers(_currentData);
  renderEmployees(_currentData);
  renderHealth(_currentData);
}

function healthScore(c){
  const tones = c.tones||[]; const tot = tones.reduce((s,t)=>s+(t.v||0),0)||1;
  const urgent = (tones.find(t=>/급함|긴급/.test(t.k))||{}).v || 0;
  const urgentRatio = urgent/tot;
  const unresolved = 1 - (c.resolveRate==null?1:c.resolveRate);
  const density = Math.min((c.issues||0)/(c.mentions||1)*4, 1);
  const risk = Math.round(100*(0.5*unresolved + 0.32*urgentRatio + 0.18*density));
  const reasons = [];
  if (c.resolveRate!=null && c.resolveRate < 0.85) reasons.push(`해결률 ${Math.round(c.resolveRate*100)}% (낮음)`);
  if (urgentRatio > 0.09) reasons.push(`'급함' 어조 ${Math.round(urgentRatio*100)}%`);
  if (density > 0.5) reasons.push(`이슈 밀도 높음(${c.issues}/${c.mentions})`);
  return { risk, urgentRatio, reasons };
}
const _normCust = s => String(s||'').replace(/㈜|주식회사|주\)/g,'').replace(/\(.*?\)/g,'').replace(/[\s·.\-]/g,'').trim();
let _arMap = {};
async function loadReceivables(fresh = false){
  if (!fresh && _arCacheAt && Date.now() - _arCacheAt < CACHE_TTL_MS) return;
  try{ const r=await fetch('/api/admin/ecount-receivables',{headers:TOKEN?{'Authorization':'Bearer '+TOKEN}:{}}); const d=await r.json(); _arMap=(d&&d.customers)||{}; _arCacheAt=Date.now(); }
  catch{ _arMap={}; }
}
const _kstDate = s => { if(!s) return '미확인'; try{ return new Date(s).toLocaleString('sv-SE',{timeZone:'Asia/Seoul'}).slice(5,16); }catch{ return String(s).slice(5,16)||'미확인'; } };
let _healthRows = [];
function openCasesOf(name, d){
  return (d.issues||[]).filter(i=>!i.resolved && !i.expired && (i.customers||[]).includes(name))
    .sort((a,b)=> String(b.lastTs||'').localeCompare(String(a.lastTs||'')));
}
function renderHealth(d){
  const el = document.getElementById('v-health');
  const q = currentQuery();
  const rows = (d.customers||[]).map(c=>{
    const s = healthScore(c);
    const ar = _arMap[_normCust(c.name)];
    if(ar && ar.balance>0){
      const bump = ar.agingMonths>=13?30 : ar.agingMonths>=7?20 : ar.agingMonths>=4?12 : 4;
      s.risk = Math.min(100, s.risk + bump); s.ar = ar;
      if(bump>=12) s.reasons.push(`미수 ${Math.round(ar.balance/10000).toLocaleString()}만·${ar.bucketLabel||ar.agingMonths+'개월'}`);
    }
    const open = openCasesOf(c.name, d);
    if(open.length){ const o=open[0]; s.reasons.push(`미회신 "${esc(o.evidence||o.summary||o.key)}"${o.lastTs?` (${_kstDate(o.lastTs)})`:''}`); }
    return { ...c, ...s, open };
  });
  if(!rows.length){ el.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  const MIN = 80;
  const allScored = rows.filter(c=>(c.mentions||0)>=MIN).sort((a,b)=>b.risk-a.risk);
  const scored = q ? allScored.filter(c => `${c.name} ${c.reasons.join(' ')}`.toLowerCase().includes(q)) : allScored;
  _healthRows = scored;
  const visible = scored.slice(0, _limits.health);
  const thin = rows.filter(c=>(c.mentions||0)<MIN).length;
  const danger = scored.filter(c=>c.risk>=38), warn = scored.filter(c=>c.risk>=28&&c.risk<38);
  const grade = r => r>=38?['위험','#f47067','b-bad']:(r>=28?['주의','#d29922','b-warn']:['정상','#3fb950','b-ok']);
  const caseLine = o => `<div class="rule">
     <b>${esc(o.key)}</b> <span class="chip">${esc(o.type||'기타')}</span>
     <span class="muted">담당 ${o.raisedBy?esc(o.raisedBy):'<i style=color:#d29922>미확인</i>'}</span>
     <span class="muted">· 방 ${esc((o.room||'—').slice(0,18))}</span>
     <span class="muted">· 최근 ${o.lastTs?_kstDate(o.lastTs):'<i style=color:#d29922>ts 미확인</i>'}</span>
     <span class="muted">· 교차검증 ${o.crossCheck==null?'—':o.crossCheck}</span>
     <div class="ev">"${o.evidence?esc(o.evidence):'<i>원문 미확인</i>'}" <span class="muted">${esc(o.summary||'')}</span></div></div>`;
  const card = (c,idx) => { const [g,col] = grade(c.risk); return `<tr>
     <td><b>${esc(c.name)}</b>${c.ar?' <span class="badge b-bad" style="font-size:10px">미수</span>':''}</td>
     <td><span style="display:inline-block;min-width:34px;font-weight:800;color:${col}">${c.risk}</span>
         <span class="badge" style="background:${col}22;color:${col}">${g}</span></td>
     <td class="muted" style="font-size:12px">${c.reasons.length?c.reasons.map(r=>r.startsWith('미회신')?r:esc(r)).join(' · '):'특이신호 없음'}</td>
     <td>${c.open.length?`<button class="mini" onclick="toggleCases(${idx})">열린 case ${c.open.length} ▸</button>`:'<span class="muted">0</span>'} <span class="muted">/ ${c.mentions}</span></td>
     <td><button class="mini b-auto" style="border-color:var(--auto);color:#b98eff" onclick="draftDunning(${idx})">확인 초안</button>
         <button class="mini" onclick="jumpIssues('${esc(c.name)}')">이슈 →</button></td></tr>`+
     `<tr class="det-row" id="det-${idx}" style="display:none"><td colspan="5" style="background:var(--panel2)">${c.open.length?c.open.map(caseLine).join(''):'<span class="muted">이 거래처의 미해결 case가 상위 이슈목록에 없음(관측한계).</span>'}</td></tr>`; };
  const noOwner = scored.reduce((n,c)=>n+c.open.filter(o=>!o.raisedBy).length,0);
  const aliasZero = scored.filter(c=>c.issues>0 && c.open.length===0).length;
  const blind = `<div class="card" style="margin-top:16px"><h3>참고 한계 (blindSpots)</h3>
     <div class="rule">이슈 상위 <b>${(d.issues||[]).length}</b>건만 표면화 — 그 아래 미해결 건은 드릴다운에 없음(관측한계, 실제 해결 아님).</div>
     <div class="rule">담당 미확인 case <b>${noOwner}</b>건 — 로스터 매칭 실패(원문에 직원 표시명 변형·거래처 자체 발신).</div>
     <div class="rule">위험 상위인데 열린 case 0건 <b>${aliasZero}</b>곳 — 거래처명 별칭 분리(예 홀렉스↔Holex) 가능. 이슈는 다른 표기로 집계됐을 수 있음.</div>
     <div class="rule">case별 ts는 정확 발화시각이 아니라 <b>분석 윈도우 최근 메시지 시각(근사)</b>. 교차검증 낮으면 품목·차수 태그 불일치.</div>
     <div class="rule">전용 소규모방(카톡 미러링 대상 아님)의 이슈는 경보에 안 잡힘 — FAIL 아님, 관측 사각지대. 표본부족(언급&lt;${MIN}) ${thin}곳 경보 제외.</div>
   </div>`;
  el.innerHTML =
    `<div class="alertbar">
       <span class="badge b-bad">위험 ${danger.length}</span>
       <span class="badge b-warn">주의 ${warn.length}</span>
       <span class="muted">· 분석 거래처 ${scored.length} (표본부족 ${thin} 제외) · 불량/주문누락 제외</span>
       <span class="muted" style="margin-left:auto">${Object.keys(_arMap).length?`ECOUNT 미수 결합 (${Object.keys(_arMap).length}곳)`:"ECOUNT 미수 미연결"}</span>
     </div>`+
    (visible.length ?
      `<table><thead><tr><th>거래처</th><th>위험도</th><th>경보 근거 (왜)</th><th>열린 case/언급</th><th>다음 액션 · 자동화</th></tr></thead><tbody>`+
      visible.map(card).join('')+`</tbody></table>` + moreButton('health', visible.length, scored.length) :
      `<div class="empty">경보 대상 없음</div>`)+
    (scored.length?blind:'');
}
function toggleCases(idx){ const r=document.getElementById('det-'+idx); if(r) r.style.display = r.style.display==='none'?'':'none'; }
function draftDunning(idx){
  const c = _healthRows[idx]; if(!c) return;
  const lines = (c.open||[]).slice(0,8).map(o=>`- ${o.key} (${o.type||'기타'}${o.raisedBy?', 담당 '+o.raisedBy:''}): ${o.summary||o.evidence||''}`);
  const arLine = c.ar ? `\n· 미수금 ${Math.round(c.ar.balance/10000).toLocaleString()}만원(${c.ar.bucketLabel||c.ar.agingMonths+'개월'}) 정산도 함께 확인 부탁드립니다.` : '';
  const body = `[${c.name} — 미해결 건 확인 요청 초안]\n안녕하세요, 네노바입니다. 아래 건 진행상황 확인 부탁드립니다.\n${lines.join('\n')||'- (열린 case 없음 — 위험신호는 어조/미수 기반)'}${arLine}\n\n※ 자동 생성 초안입니다. 발송 전 담당자 확인 필요.`;
  let box = document.getElementById('draftBox');
  if(!box){ box=document.createElement('div'); box.id='draftBox';
    box.style.cssText='position:fixed;right:22px;bottom:22px;width:min(440px,92vw);background:var(--panel);border:1px solid var(--auto);border-radius:12px;padding:14px 16px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)';
    document.body.appendChild(box); }
  box.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="badge b-auto">자동화 후보</span>
      <span class="muted" style="font-size:11px">신뢰도: 검토 1스텝 — 사람 확인 후 발송(자동발송 아님)</span>
      <button class="mini" style="margin-left:auto" onclick="document.getElementById('draftBox').remove()">닫기</button></div>
    <textarea style="width:100%;height:180px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;font-family:inherit;resize:vertical">${esc(body)}</textarea>
    <div style="margin-top:8px;display:flex;gap:8px"><button class="mini" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.parentElement.previousElementSibling.value)">복사</button>
      <span class="muted" style="font-size:11px;align-self:center">대상: ${esc(c.name)} · 열린 case ${(c.open||[]).length}건</span></div>`;
}
function jumpIssues(name){
  document.getElementById('search').value = name;
  resetLimits();
  renderAll();
  document.querySelector('.tab[data-v="issues"]').click();
}

function renderKpis(d){
  const s = d.issueSummary||{};
  const k = [
    ['분석 윈도우', d.windowsAnalyzed||0],
    ['이슈(케이스)', s.total||0],
    ['미해결', s.unresolved||0, s.unresolved? 'var(--bad)':''],
    ['만료(차수 지남)', s.expired||0, ''],
    ['교차검증', pct(d.crossCheckAvg)],
    ['거래처', (d.customers||[]).length],
    ['직원', (d.employees||[]).length],
    ['자동화후보', (d.playbook&&d.playbook.automationCandidates||[]).length, 'var(--auto)'],
  ];
  document.getElementById('kpis').innerHTML = k.map(([l,n,c])=>`<div class="kpi"><div class="n" style="color:${c||'var(--txt)'}">${n}</div><div class="l">${l}</div></div>`).join('');
}

function renderIssues(d){
  const q = currentQuery();
  const allRows = (d.issues||[]);
  const rows = q ? allRows.filter(i => `${i.key||''} ${i.type||''} ${i.raisedBy||''} ${(i.customers||[]).join(' ')} ${i.evidence||''} ${i.summary||''}`.toLowerCase().includes(q)) : allRows;
  if(!rows.length){ document.getElementById('v-issues').innerHTML='<div class="empty">데이터 없음</div>'; return; }
  const visible = rows.slice(0, _limits.issues);
  const byType = (d.issueSummary&&d.issueSummary.byType)||[];
  document.getElementById('v-issues').innerHTML =
    `<div style="margin-bottom:10px">유형 분포: ${chips(byType)}</div>`+
    `<table><thead><tr><th>케이스(품목·차수)</th><th>유형</th><th>담당</th><th>거래처</th><th>상태</th><th>근거</th><th>요약</th></tr></thead><tbody>`+
    visible.map(i=>`<tr>
      <td><b>${esc(i.key)}</b></td>
      <td>${esc(i.type)}</td>
      <td>${esc(i.raisedBy)||'<span class=muted>—</span>'}</td>
      <td>${(i.customers||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join('')||'<span class=muted>—</span>'}</td>
      <td>${i.resolved?'<span class="badge b-ok">해결</span>':i.expired?'<span class="badge">만료</span>':'<span class="badge b-bad">미해결</span>'}</td>
      <td class="muted">${esc(i.evidence)}</td>
      <td>${esc(i.summary)}</td></tr>`).join('')+`</tbody></table>` + moreButton('issues', visible.length, rows.length);
}

function renderPlaybook(d){
  const p = d.playbook||{};
  const auto = p.automationCandidates||[], jud = p.judgmentRules||[];
  const ruleRow = r => `<div class="rule"><div>${esc(r.rule)} <span class="muted">×${r.count}${r.variants>1?` · ${r.variants}종 표현`:''}</span></div></div>`;
  document.getElementById('v-playbook').innerHTML = `<div class="grid2">
    <div class="card"><h3>자동화 후보 <span class="cnt">기계적 규칙 · ${auto.length}</span></h3>${auto.length?auto.map(ruleRow).join(''):'<div class="muted">—</div>'}</div>
    <div class="card"><h3>사람 판단 유지 <span class="cnt">judgment · ${jud.length}</span></h3>${jud.length?jud.map(ruleRow).join(''):'<div class="muted">—</div>'}</div>
    <div class="card"><h3>해결 절차(플레이북)</h3>${(p.steps||[]).map(s=>`<div class="rule">${esc(s.k)} <span class="muted">×${s.v}</span></div>`).join('')||'<div class="muted">—</div>'}</div>
    <div class="card"><h3>사람 판단이 필요했던 지점</h3>${(p.humanJudgment||[]).map(s=>`<div class="rule"><span class="badge b-hum">판단</span> ${esc(s.k)} <span class="muted">×${s.v}</span></div>`).join('')||'<div class="muted">—</div>'}</div>
  </div>`;
}

function renderCustomers(d){
  const q = currentQuery();
  const allRows = d.customers||[];
  const rows = q ? allRows.filter(c => String(c.name||'').toLowerCase().includes(q)) : allRows;
  if(!rows.length){ document.getElementById('v-customers').innerHTML='<div class="empty">데이터 없음</div>'; return; }
  const visible = rows.slice(0, _limits.customers);
  document.getElementById('v-customers').innerHTML =
    `<table><thead><tr><th>거래처</th><th>언급</th><th>이슈수</th><th>해결률</th><th>유형</th><th>톤</th></tr></thead><tbody>`+
    visible.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.mentions}</td><td>${c.issues}</td><td>${pct(c.resolveRate)}</td><td>${chips(c.types)}</td><td>${chips(c.tones)}</td></tr>`).join('')+`</tbody></table>` + moreButton('customers', visible.length, rows.length);
}

function renderEmployees(d){
  const q = currentQuery();
  const allRows = d.employees||[];
  const rows = q ? allRows.filter(e => `${e.name||''} ${(e.aliases||[]).join(' ')}`.toLowerCase().includes(q)) : allRows;
  if(!rows.length){ document.getElementById('v-employees').innerHTML='<div class="empty">데이터 없음</div>'; return; }
  const visible = rows.slice(0, _limits.employees);
  document.getElementById('v-employees').innerHTML =
    `<table><thead><tr><th>직원</th><th>표시명</th><th>처리(제기)</th><th>해결률</th><th>유형 분포</th></tr></thead><tbody>`+
    visible.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td class="muted">${(e.aliases||[]).map(a=>esc(a)).join(', ')||'—'}</td><td>${e.handled}</td><td>${pct(e.resolveRate)}</td><td>${chips(e.types)}</td></tr>`).join('')+`</tbody></table>` + moreButton('employees', visible.length, rows.length);
}

document.getElementById('tabs').addEventListener('click', e=>{
  if(!e.target.dataset.v) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===e.target));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='v-'+e.target.dataset.v));
});
document.getElementById('refresh').addEventListener('click', () => load(true));
document.getElementById('hours').addEventListener('change', () => load(false));
document.getElementById('search').addEventListener('input', () => { resetLimits(); renderAll(); });
load(false);
</script>
</body>
</html>
